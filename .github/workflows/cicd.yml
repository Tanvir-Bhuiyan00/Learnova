name: CI-CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  REGISTRY: docker.io

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install server deps
        working-directory: ./server
        run: pnpm install --frozen-lockfile

      - name: Lint server
        working-directory: ./server
        run: pnpm lint

      - name: Generate Prisma client
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
        run: pnpm run generate

      - name: Build server
        working-directory: ./server
        run: pnpm build

      - name: Install client deps
        working-directory: ./client
        run: pnpm install --frozen-lockfile

      - name: Lint client
        working-directory: ./client
        run: pnpm lint

      - name: Build client
        working-directory: ./client
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.CLIENT_PUBLIC_API_BASE_URL }}
        run: pnpm exec next build

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image namespace
        id: vars
        shell: bash
        run: echo "namespace=${{ secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            docker.io/${{ steps.vars.outputs.namespace }}/learnova-server:latest
            docker.io/${{ steps.vars.outputs.namespace }}/learnova-server:${{ github.sha }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.CLIENT_PUBLIC_API_BASE_URL }}
          push: true
          tags: |
            docker.io/${{ steps.vars.outputs.namespace }}/learnova-client:latest
            docker.io/${{ steps.vars.outputs.namespace }}/learnova-client:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Normalize image namespace
        id: vars
        shell: bash
        run: echo "namespace=${{ secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_OUTPUT"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            if [ -z "$APP_DIR" ]; then
              echo "VPS_APP_DIR secret is empty. Set it to the repo path on the VPS, e.g. /opt/apps/learnova."
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "VPS_APP_DIR has no repo checkout: $APP_DIR"
              echo "Clone it first, e.g.:"
              echo "  sudo mkdir -p /opt/apps && sudo chown ubuntu:ubuntu /opt/apps && cd /opt/apps && git clone https://github.com/Tanvir-Bhuiyan00/Learnova.git learnova"
              exit 1
            fi

            cd "$APP_DIR"

            git fetch --all --prune
            git checkout main
            git reset --hard ${{ github.sha }}

            printf '%s' "${{ secrets.SERVER_ENV_PRODUCTION }}" > server/.env.production

            export REGISTRY=docker.io
            export IMAGE_NAMESPACE=${{ steps.vars.outputs.namespace }}
            export IMAGE_TAG=${{ github.sha }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
            export JWT_ACCESS_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d learnova-db
            docker compose -f docker-compose.prod.yaml run --rm learnova-server sh -lc "./node_modules/.bin/prisma migrate deploy --schema=prisma/schema && ./node_modules/.bin/prisma db push --schema=prisma/schema"

            if [ ! -f "$APP_DIR/.seeded" ]; then
              docker compose -f docker-compose.prod.yaml run --rm learnova-server sh -lc "tsx src/scripts/seed-courses.ts && tsx src/scripts/index-rag.ts"
              touch "$APP_DIR/.seeded"
            fi

            docker compose -f docker-compose.prod.yaml up -d learnova-server learnova-client
            docker image prune -f