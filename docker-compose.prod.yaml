services:
  learnova-db:
    image: postgres:16-alpine
    container_name: learnova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: learnova
    volumes:
      - learnova-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnova -d learnova"]
      interval: 5s
      timeout: 5s
      retries: 10

  learnova-server:
    image: docker.io/${IMAGE_NAMESPACE}/learnova-server:${IMAGE_TAG}
    container_name: learnova-server
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      learnova-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/v1/rag/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  learnova-client:
    image: docker.io/${IMAGE_NAMESPACE}/learnova-client:${IMAGE_TAG}
    container_name: learnova-client
    restart: unless-stopped
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      learnova-server:
        condition: service_started

volumes:
  learnova-pgdata: